api = "0.7"

[buildpack]
  description = "A Cloud Native Buildpack that provides JVM build tools (Leiningen, Clojure Tools, Gradle, Maven, sbt) and builds JVM applications with them"
  homepage = "https://github.com/paketo-buildpacks/jvm-build-tools"
  id = "paketo-buildpacks/jvm-build-tools"
  keywords = ["java", "jvm", "leiningen", "clojure", "gradle", "maven", "sbt", "jvm-build-tools"]
  name = "Paketo Buildpack for JVM Build Tools"
  sbom-formats = ["application/vnd.syft+json", "application/vnd.cyclonedx+json"]
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/jvm-build-tools/blob/main/LICENSE"

[metadata]
  include-files = ["LICENSE", "NOTICE", "README.md", "buildpack.toml", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run"]
  pre-package = "scripts/build.sh --target linux/amd64 --target linux/arm64"

  [[metadata.configurations]]
    build = true
    default = "leiningen,clojure-tools,gradle,maven,sbt"
    description = "the build tools this buildpack manages (comma separated, in detection order)"
    name = "BP_BUILD_TOOLS"

  [[metadata.configurations]]
    build = true
    default = "uberjar"
    description = "the arguments to pass to Lein"
    name = "BP_LEIN_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = "target/*-standalone.jar"
    description = "the built application artifact explicitly.  Supersedes $BP_LEIN_BUILT_MODULE"
    name = "BP_LEIN_BUILT_ARTIFACT"

  [[metadata.configurations]]
    build = true
    description = "the module to find application artifact in"
    name = "BP_LEIN_BUILT_MODULE"

  [[metadata.configurations]]
    build = true
    default = "-X:uberjar"
    description = "the arguments to pass to Clojure"
    name = "BP_CLJ_DEPS_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = "false"
    description = "the arguments to enable Tools Build"
    name = "BP_CLJ_TOOLS_BUILD_ENABLED"

  [[metadata.configurations]]
    build = true
    default = "-T:build uber"
    description = "the arguments to pass to Tools Build"
    name = "BP_CLJ_TOOLS_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = "target/*.jar"
    description = "the built application artifact explicitly. Supersedes $BP_CLJ_BUILT_MODULE"
    name = "BP_CLJ_BUILT_ARTIFACT"

  [[metadata.configurations]]
    build = true
    description = "the module to find application artifact in"
    name = "BP_CLJ_BUILT_MODULE"

  [[metadata.configurations]]
    build = true
    default = "-Dmaven.test.skip=true --no-transfer-progress package"
    description = "the arguments to pass to Maven"
    name = "BP_MAVEN_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "the additionnal arguments (appended to BP_MAVEN_BUILD_ARGUMENTS) to pass to Maven"
    name = "BP_MAVEN_ADDITIONAL_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "the active profiles (comma separated: such as: p1,!p2,?p3) to pass to Maven"
    name = "BP_MAVEN_ACTIVE_PROFILES"

  [[metadata.configurations]]
    build = true
    default = "target/*.[ejw]ar"
    description = "the built application artifact explicitly.  Supersedes $BP_MAVEN_BUILT_MODULE"
    name = "BP_MAVEN_BUILT_ARTIFACT"

  [[metadata.configurations]]
    build = true
    default = "pom.xml"
    description = "the location of the main pom.xml file, relative to the application root"
    detect = true
    name = "BP_MAVEN_POM_FILE"

  [[metadata.configurations]]
    build = true
    description = "the module to find application artifact in"
    name = "BP_MAVEN_BUILT_MODULE"

  [[metadata.configurations]]
    build = true
    default = "false"
    description = "use maven daemon"
    name = "BP_MAVEN_DAEMON_ENABLED"

  [[metadata.configurations]]
    build = true
    description = "the path to a Maven settings file"
    name = "BP_MAVEN_SETTINGS_PATH"

  [[metadata.configurations]]
    build = true
    default = "3"
    description = "the Maven version"
    name = "BP_MAVEN_VERSION"

  [[metadata.configurations]]
    build = true
    default = "--no-daemon -Dorg.gradle.welcome=never assemble"
    description = "the arguments to pass to Gradle"
    name = "BP_GRADLE_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "the additionnal arguments (appended to BP_GRADLE_BUILD_ARGUMENTS) to pass to Gradle"
    name = "BP_GRADLE_ADDITIONAL_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    description = "the location of the main build config file, relative to the application root"
    detect = true
    name = "BP_GRADLE_BUILD_FILE"

  [[metadata.configurations]]
    build = true
    default = "build/libs/*.[jw]ar"
    description = "the built application artifact explicitly.  Supersedes $BP_GRADLE_BUILT_MODULE"
    name = "BP_GRADLE_BUILT_ARTIFACT"

  [[metadata.configurations]]
    build = true
    description = "the module to find application artifact in"
    name = "BP_GRADLE_BUILT_MODULE"

  [[metadata.configurations]]
    build = true
    description = "the path to a Gradle init script file"
    name = "BP_GRADLE_INIT_SCRIPT_PATH"

  [[metadata.configurations]]
    build = true
    default = "universal:packageBin"
    description = "the arguments to pass to SBT"
    name = "BP_SBT_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = "target/universal/*.zip"
    description = "the built application artifact explicitly.  Supersedes $BP_SBT_BUILT_MODULE"
    name = "BP_SBT_BUILT_ARTIFACT"

  [[metadata.configurations]]
    build = true
    description = "the module to find application artifact in"
    name = "BP_SBT_BUILT_MODULE"

  [[metadata.configurations]]
    build = true
    default = "1"
    description = "the version of SBT to install"
    name = "BP_SBT_VERSION"

  [[metadata.configurations]]
    build = true
    description = "the path to the SBT repositories file"
    name = "BP_SBT_REPOSITORIES_FILE"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "colon separated list of glob patterns, matched source files are included"
    name = "BP_INCLUDE_FILES"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "colon separated list of glob patterns, matched source files are removed"
    name = "BP_EXCLUDE_FILES"

  [[metadata.configurations]]
    build = true
    default = "false"
    description = "whether to install Yarn/Node binaries based on the presence of a package.json or yarn.lock file"
    name = "BP_JAVA_INSTALL_NODE"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "configure a project subdirectory to look for `package.json` and `yarn.lock` files"
    name = "BP_NODE_PROJECT_PATH"

